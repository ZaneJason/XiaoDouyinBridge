server:
  port: 8765
  address: 0.0.0.0

spring:
  datasource:
    url: ${XIAODOUYINBRIDGE_DB_URL:jdbc:mariadb://127.0.0.1:3306/xiaodouyinbridge}
    username: ${XIAODOUYINBRIDGE_DB_USER:xiaodouyinbridge}
    password: ${XIAODOUYINBRIDGE_DB_PASSWORD:change-me}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 10000
  sql:
    init:
      mode: always
      encoding: UTF-8

bridge:
  # 正式部署时务必改掉，并与 Minecraft 插件 config.yml 保持一致。
  api-key: ${XIAODOUYINBRIDGE_API_KEY:change-me}

douyin:
  # 抖音开放平台直播小玩法 / 互动插件应用凭据。AppSecret 只能放在 Bridge 服务端。
  app-id: ${DOUYIN_APP_ID:}
  app-secret: ${DOUYIN_APP_SECRET:}

  # 开放平台「直播间数据能力开发配置」里设置的数据密钥。
  # 官方自测工具未配置时可能使用 default；生产环境务必改成你自己的随机密钥。
  data-secret: ${DOUYIN_DATA_SECRET:default}

logging:
  file:
    # 同时保留控制台日志和文件日志；生产环境可通过环境变量修改目录。
    name: ${XIAODOUYINBRIDGE_LOG_FILE:logs/xiaodouyinbridge.log}
  level:
    root: INFO
    com.zanejason.xiaodouyinbridge: INFO
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{60} - %msg%n"
