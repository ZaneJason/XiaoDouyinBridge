name: Build XiaoDouyinBridge

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Upload Minecraft plugin
        uses: actions/upload-artifact@v4
        with:
          name: XiaoDouyinBridge-Minecraft
          path: minecraft-plugin/target/XiaoDouyinBridge-1.0.0.jar

      - name: Upload Bridge server
        uses: actions/upload-artifact@v4
        with:
          name: XiaoDouyinBridge-Server
          path: bridge-server/target/bridge-server-1.0.0-SNAPSHOT.jar

  launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure launcher
        run: cmake -S douyin-launcher -B douyin-launcher/build -A x64

      - name: Build launcher
        run: cmake --build douyin-launcher/build --config Release

      - name: Stage launcher artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path douyin-launcher/package | Out-Null
          Copy-Item douyin-launcher/build/Release/XiaoDouyinBridge.exe douyin-launcher/package/
          Copy-Item douyin-launcher/launcher.conf.example douyin-launcher/package/
          Set-Content -Encoding UTF8 douyin-launcher/package/README.txt @'
          XiaoDouyinBridge Live Companion Launcher

          1. Copy the official x64 PipeSDK.dll beside XiaoDouyinBridge.exe.
          2. Copy launcher.conf.example to launcher.conf.
          3. Configure bridge.base-url and bridge.launcher-key.
          4. Start the EXE from Douyin Live Companion, not by double-clicking for production use.

          PipeSDK.dll is not redistributed by this repository and must come from the official Douyin pure_PipeSDK package.
          '@

      - name: Upload Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: XiaoDouyinBridge-Launcher-Windows-x64
          path: douyin-launcher/package/
