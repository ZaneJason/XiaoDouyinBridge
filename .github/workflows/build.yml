name: Build XiaoDouyinBridge

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Upload Minecraft plugin
        uses: actions/upload-artifact@v4
        with:
          name: XiaoDouyinBridge-Minecraft
          path: minecraft-plugin/target/XiaoDouyinBridge-1.0.0.jar

      - name: Upload Bridge server
        uses: actions/upload-artifact@v4
        with:
          name: XiaoDouyinBridge-Server
          path: bridge-server/target/bridge-server-1.0.0-SNAPSHOT.jar

  launcher-core:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure launcher core
        run: cmake -S douyin-launcher -B douyin-launcher/build -DXDB_WITH_PIPESDK=OFF

      - name: Build launcher core
        run: cmake --build douyin-launcher/build --config Release

      # Do not upload this EXE as a production artifact yet: the official Douyin
      # PipeSDK is intentionally not redistributed in this repository. The CI job
      # only verifies argument parsing, config, logging and HTTPS Bridge code.
